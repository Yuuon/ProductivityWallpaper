<svg xmlns="http://www.w3.org/2000/svg" width="64" height="36" viewBox="0 0 64 36">
  <!-- Interactive wallpaper thumbnail placeholder -->
  <!-- Background -->
  <rect width="64" height="36" rx="4" ry="4" fill="#1A1830"/>
  <!-- Mouse cursor + click ripple icon -->
  <g transform="translate(22, 4)" fill="none" stroke="#A4A3B6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Cursor arrow -->
    <path d="M3,3 L3,21.5 L8.5,16 L14,19 L16,14.5 L10.5,11.5 L18,8 Z" fill="#A4A3B6" opacity="0.6"/>
    <!-- Click ripple circles -->
    <circle cx="3" cy="3" r="5" opacity="0.3"/>
    <circle cx="3" cy="3" r="9" opacity="0.15"/>
  </g>
</svg>
